[package]
name = "tracker-core"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
file-id = "0.2.3"
log = "0.4.34"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.21"
tiny_http = "0.12.0"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
