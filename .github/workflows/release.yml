name: Release build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # a fixed compiler, so the same tag always builds the same way; raise it on purpose
  RUST_TOOLCHAIN: 1.99.0

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # later steps run third-party code (npm, build scripts) that has no use for the token
          persist-credentials: false

      - name: Tag matches the app version
        # a mistyped tag would otherwise build packages named for another version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in tauri.conf.json"
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Rust toolchain
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
          rustup default ${{ env.RUST_TOOLCHAIN }}

      - name: Install UI dependencies
        run: npm --prefix ui ci --ignore-scripts

      # no update signing key on the runner: the updater signature is added after code signing
      - name: Build installer
        run: npm --prefix ui run release

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer
          path: target/release/bundle/release/*.exe
          if-no-files-found: error

  # 22.04 has the oldest glibc we support, so the packages also run on newer systems
  linux:
    runs-on: ubuntu-22.04
    env:
      # the AppImage tools are AppImages themselves; runners have no FUSE
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches the app version
        # a mistyped tag would otherwise build packages named for another version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in tauri.conf.json"
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev file

      - name: Rust toolchain
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
          rustup default ${{ env.RUST_TOOLCHAIN }}

      - name: Install UI dependencies
        run: npm --prefix ui ci --ignore-scripts

      # Tauri downloads its AppImage tools without checking them, one from the moving "continuous"
      # tag. They are fetched here instead, checked against known hashes and left where Tauri looks
      # first. A failed check means upstream changed a file: review the new one, then update its hash.
      - name: AppImage tools
        run: |
          dir="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$dir"
          fetch() {
            curl -fsSL --retry 3 -o "$dir/$1" "$2"
            echo "$3  $dir/$1" | sha256sum -c -
            chmod +x "$dir/$1"
          }
          fetch AppRun-x86_64 https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64 f30140a43a0a59e46db21bdefdf749b9e9f2c6946e92afabbacf98b8ae73fb4f
          fetch linuxdeploy-07333c6-x86_64.AppImage https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy-07333c6/linuxdeploy-x86_64.AppImage 36a2d7e274d12e1050d0e9ecfe11d339ed54720b2bec464c286d53f8b07f5c62
          fetch linuxdeploy-plugin-appimage.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage 49d6a17160675a6bd1781699aae6bdf7692d98552e02a3671d2183d10547842e

      # no update signing key on the runner: the packages are signed afterwards on the maintainer's machine
      - name: Build packages
        run: npm --prefix ui run release

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages
          path: |
            target/release/bundle/release/*.deb
            target/release/bundle/release/*.rpm
            target/release/bundle/release/*.AppImage
          if-no-files-found: error
