name: Release build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # a fixed compiler, so the same tag always builds the same way; raise it on purpose
  RUST_TOOLCHAIN: 1.99.0

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # later steps run third-party code (npm, build scripts) that has no use for the token
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Rust toolchain
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
          rustup default ${{ env.RUST_TOOLCHAIN }}

      - name: Install UI dependencies
        run: npm --prefix ui ci --ignore-scripts

      # no update signing key on the runner: the updater signature is added after code signing
      - name: Build installer
        run: npm --prefix ui run release

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer
          path: target/release/bundle/release/*.exe
          if-no-files-found: error

  # 22.04 has the oldest glibc we support, so the packages also run on newer systems
  linux:
    runs-on: ubuntu-22.04
    env:
      # the AppImage tools are AppImages themselves; runners have no FUSE
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev file

      - name: Rust toolchain
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
          rustup default ${{ env.RUST_TOOLCHAIN }}

      - name: Install UI dependencies
        run: npm --prefix ui ci --ignore-scripts

      # no update signing key on the runner: the packages are signed afterwards on the maintainer's machine
      - name: Build packages
        run: npm --prefix ui run release

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages
          path: |
            target/release/bundle/release/*.deb
            target/release/bundle/release/*.rpm
            target/release/bundle/release/*.AppImage
          if-no-files-found: error
