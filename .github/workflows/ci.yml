name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # the same compiler as release.yml, so a new Rust release cannot fail an unrelated pull request
  RUST_TOOLCHAIN: 1.99.0

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22.04 is the oldest Linux with WebKitGTK 4.1, so it stands in for Debian 12 as well
        os: [windows-latest, macos-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # later steps run third-party code (npm, build scripts) that has no use for the token
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Rust toolchain
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component clippy
          rustup default ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install UI dependencies
        run: npm --prefix ui ci --ignore-scripts

      - name: Type-check UI
        run: npm --prefix ui run check

      # the desktop crate embeds ui/dist, so the UI is built before any cargo step
      - name: Build UI
        run: npm --prefix ui run build

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked
