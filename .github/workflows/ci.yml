name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # the same compiler as release.yml, so a new Rust release cannot fail an unrelated pull request
  RUST_TOOLCHAIN: 1.99.0
  LINUX_PACKAGES: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
  # a stalled mirror connection is retried instead of holding the job
  APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=60

concurrency:
  group: ci-${{ github.ref }}
  # a newer push replaces a pull request's run; every commit on main keeps its own result
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22.04 is the oldest Linux with WebKitGTK 4.1, so it stands in for Debian 12 as well
        os: [windows-latest, macos-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # later steps run third-party code (npm, build scripts) that has no use for the token
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # WebKitGTK and its ~120 dependencies come from a mirror that is sometimes very slow. The
      # packages are cached under their exact versions; apt checks every cached file against the
      # signed index before it uses it.
      - name: Linux package list
        id: apt
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get $APT_OPTS update
          sum=$(apt-get install -s --no-install-recommends $LINUX_PACKAGES | grep '^Inst ' | sha256sum | cut -c1-16)
          echo "key=apt-${{ matrix.os }}-$sum" >> "$GITHUB_OUTPUT"

      - name: Linux package cache
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt.outputs.key }}
          restore-keys: apt-${{ matrix.os }}-

      - name: Linux system libraries
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get $APT_OPTS -o Dir::Cache::Archives="$HOME/apt-archives" install -y --no-install-recommends $LINUX_PACKAGES
          # versions the mirror no longer has would only grow the cache
          sudo apt-get -o Dir::Cache::Archives="$HOME/apt-archives" autoclean
          # the cache is saved by this user after the job
          sudo rm -f ~/apt-archives/lock
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives

      - name: Rust toolchain
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component clippy
          rustup default ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install UI dependencies
        run: npm --prefix ui ci --ignore-scripts

      - name: Type-check UI
        run: npm --prefix ui run check

      - name: Test UI
        run: npm --prefix ui test

      # the desktop crate embeds ui/dist, so the UI is built before any cargo step
      - name: Build UI
        run: npm --prefix ui run build

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      # every ingest scenario again with one record per read round
      - name: Tests in read rounds
        run: cargo test -p tracker-core --locked --test ingest --test antigravity --test rounds --test opencode --test accounts
        env:
          TRACKER_TEST_ROUND: "1"

  # known advisories fail the run; the few that cannot be fixed here are listed with their reason
  # in .cargo/audit.toml
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
          rustup default ${{ env.RUST_TOOLCHAIN }}

      - name: Rust advisories
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --deny unsound --deny yanked

      - name: npm advisories
        run: npm --prefix ui audit --audit-level=high
