[package]
name = "ai-usage-tracker"
version.workspace = true
description = "Local, private tracker for AI tool token usage, API-equivalent cost and plan limits"
edition = "2024"
license.workspace = true
rust-version = "1.90"

[lib]
name = "ai_usage_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tracker-core = { path = "../crates/tracker-core" }
tauri = { version = "2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
chrono = "0.4"
notify = "8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
# same versions as Tauri's own WebView2 binding, for the PDF report (PrintToPdf)
webview2-com = "0.39"
windows = "0.62"
