<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8bea"/>
      <stop offset="1" stop-color="#1c5cab"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#gloss)"/>
  <!-- track -->
  <circle cx="512" cy="512" r="250" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="76"/>
  <!-- usage arc: ~72% -->
  <circle cx="512" cy="512" r="250" fill="none" stroke="#ffffff" stroke-width="76" stroke-linecap="round"
          stroke-dasharray="1131 1571" transform="rotate(-90 512 512)"/>
  <!-- three bars -->
  <rect x="432" y="520" width="40" height="88" rx="20" fill="#ffffff"/>
  <rect x="492" y="460" width="40" height="148" rx="20" fill="#ffffff"/>
  <rect x="552" y="410" width="40" height="198" rx="20" fill="#ffffff"/>
</svg>
